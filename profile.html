<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | МойМагазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop"></i> МойМагазин</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link active" href="profile.html">Профиль</a></li>
                </ul>
                <span class="navbar-text ms-3">
                    <i class="bi bi-cart"></i> Корзина: <span id="cartCount">0</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <!-- Боковое меню -->
            <div class="col-md-3 mb-4">
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action active" data-tab="profile">
                        <i class="bi bi-person"></i> Профиль
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" data-tab="orders">
                        <i class="bi bi-box"></i> Мои заказы
                    </a>
                    <a href="#" class="list-group-item list-group-item-action" data-tab="settings">
                        <i class="bi bi-gear"></i> Настройки
                    </a>
                    <a href="#" class="list-group-item list-group-item-action text-danger" id="logoutBtn">
                        <i class="bi bi-box-arrow-right"></i> Выйти
                    </a>
                </div>
            </div>

            <!-- Контент -->
            <div class="col-md-9">
                <!-- Вкладка Профиль -->
                <div id="profileTab" class="tab-content-active">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0"><i class="bi bi-person-circle"></i> Информация о пользователе</h4>
                        </div>
                        <div class="card-body">
                            <form id="profileForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Имя</label>
                                        <input type="text" class="form-control" id="userName" value="Иван Петров">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control" id="userEmail" value="ivan@example.com">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Телефон</label>
                                        <input type="tel" class="form-control" id="userPhone" value="+7 (999) 123-45-67">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Дата регистрации</label>
                                        <input type="text" class="form-control" id="userRegDate" readonly>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save"></i> Сохранить изменения
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Вкладка Заказы -->
                <div id="ordersTab" class="tab-content-hidden" style="display: none;">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0"><i class="bi bi-truck"></i> История заказов</h4>
                        </div>
                        <div class="card-body" id="ordersList">
                            <!-- Заказы загружаются из localStorage -->
                        </div>
                    </div>
                </div>

                <!-- Вкладка Настройки -->
                <div id="settingsTab" class="tab-content-hidden" style="display: none;">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0"><i class="bi bi-palette"></i> Настройки сайта</h4>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Тема оформления</label>
                                <select class="form-select" id="themeSelect">
                                    <option value="light">Светлая</option>
                                    <option value="dark">Темная</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="notificationsToggle">
                                    <label class="form-check-label" for="notificationsToggle">
                                        Получать уведомления о скидках
                                    </label>
                                </div>
                            </div>
                            <button class="btn btn-primary" id="saveSettings">
                                <i class="bi bi-check-circle"></i> Сохранить настройки
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Уведомление Toast -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-autohide="true" data-bs-delay="3000">
            <div class="toast-header bg-success text-white">
                <strong class="me-auto"><i class="bi bi-check-circle"></i> Успешно</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toastMessage">
                Данные сохранены!
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-3 mt-5">
        <div class="container text-center">
            <small>&copy; 2025 МойМагазин</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
