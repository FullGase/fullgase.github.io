<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | МойМагазин</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-shop"></i> МойМагазин</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link active" href="catalog.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Профиль</a></li>
                </ul>
                <span class="navbar-text ms-3">
                    <i class="bi bi-cart"></i> Корзина: <span id="cartCount">0</span>
                </span>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <!-- Фильтры -->
            <div class="col-md-3">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="bi bi-funnel"></i> Фильтры</h5>
                    </div>
                    <div class="card-body">
                        <h6>Категория</h6>
                        <div class="form-check">
                            <input class="form-check-input filter-category" type="checkbox" value="electronics" id="catElectronics">
                            <label class="form-check-label" for="catElectronics">Электроника</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-category" type="checkbox" value="accessories" id="catAccessories">
                            <label class="form-check-label" for="catAccessories">Аксессуары</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input filter-category" type="checkbox" value="audio" id="catAudio">
                            <label class="form-check-label" for="catAudio">Аудио</label>
                        </div>
                        <hr>
                        <h6>Цена: до <span id="priceValue">50000</span> ₽</h6>
                        <input type="range" class="form-range" id="priceFilter" min="0" max="150000" step="5000" value="50000">
                        <button class="btn btn-primary w-100 mt-3" id="applyFilters">
                            <i class="bi bi-search"></i> Применить
                        </button>
                        <button class="btn btn-outline-secondary w-100 mt-2" id="resetFilters">
                            <i class="bi bi-arrow-repeat"></i> Сбросить
                        </button>
                    </div>
                </div>
            </div>

            <!-- Товары -->
            <div class="col-md-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>Каталог товаров</h2>
                    <select class="form-select w-auto" id="sortSelect">
                        <option value="default">Сортировка: по умолчанию</option>
                        <option value="price-asc">Цена: по возрастанию</option>
                        <option value="price-desc">Цена: по убыванию</option>
                        <option value="name-asc">Название: А-Я</option>
                    </select>
                </div>

                <div class="row" id="productsContainer">
                    <!-- Товары загружаются через JS -->
                </div>

                <!-- Пагинация -->
                <nav class="mt-4" id="paginationContainer">
                    <ul class="pagination justify-content-center" id="pagination"></ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Модальное окно корзины -->
    <div class="modal fade" id="cartModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-cart"></i> Корзина</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="cartItems">
                    <!-- Содержимое корзины -->
                </div>
                <div class="modal-footer">
                    <h5>Итого: <span id="cartTotal">0</span> ₽</h5>
                    <button class="btn btn-success" id="checkoutBtn">Оформить заказ</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white py-3 mt-5">
        <div class="container text-center">
            <small>&copy; 2026 МойМагазин</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
